[package]
name        = "halo2-solana-verifier"
version     = "0.1.0"
description = "no_std Halo2 BN254/KZG verifier with a tested GWC path for Solana SBF"
edition.workspace      = true
license.workspace      = true
rust-version.workspace = true
readme        = "../../README.md"
keywords      = ["solana", "halo2", "zkp", "bn254", "kzg"]
categories    = ["cryptography", "no-std"]

[lib]
crate-type = ["lib"]

[features]
default      = []
# Use Solana alt_bn128 + raw keccak/modexp syscalls (BPF target).
# Off → fall back to arkworks-only / sha3 host execution.
# Does not pull solana-program (incompatible with Quasar no_std panic_impl).
solana-syscalls = ["dep:solana-bn254", "dep:solana-define-syscall"]
# Optional compatibility flag retained for existing callers.
devnet-feature-gates = []
# Route alt_bn128 calls to the SIMD-0284 little-endian syscall variants.
# Enable this only on a runtime where the corresponding feature is active.
simd-0284-le = ["solana-syscalls"]
# Enable allocator on host targets that need std (tests).
std = ["ark-bn254/std", "ark-ff/std", "ark-ec/std", "ark-serialize/std"]
# Verifier-side eprintln of intermediate values for golden-vector debugging.
# Implies `std`. Production builds must NOT enable this.
debug-trace = ["std"]

[dependencies]
ark-bn254       = { workspace = true }
ark-ff          = { workspace = true }
ark-ec          = { workspace = true }
ark-serialize   = { workspace = true }
ark-std         = { workspace = true }
sha3            = { workspace = true }

solana-bn254           = { workspace = true, optional = true }
solana-define-syscall  = { workspace = true, optional = true }

[dev-dependencies]
hex             = { workspace = true, features = ["std"] }

[lints.rust.unexpected_cfgs]
level = "warn"
check-cfg = ['cfg(target_os, values("solana"))']
